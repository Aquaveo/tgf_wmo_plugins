uffis_storm_impact_summary_comoros = "tgf_wmo_plugins.storm_impact_summary:StormImpactSummaryComoros"
# live TITO inputs and products
uffis_flood_map_layer_guatemala = "tgf_wmo_plugins.flood_map_layer:FloodMapLayerGuatemala"
uffis_flood_map_layer_haiti = "tgf_wmo_plugins.flood_map_layer:FloodMapLayerHaiti"
