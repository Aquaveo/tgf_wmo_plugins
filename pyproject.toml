uffis_flood_map_layer_comoros = "tgf_wmo_plugins.flood_map_layer:FloodMapLayerComoros"
uffis_risk_matrix_guatemala = "tgf_wmo_plugins.ibf:RiskMatrixGuatemala"
uffis_risk_filter_guatemala = "tgf_wmo_plugins.ibf:RiskFilterGuatemala"
uffis_risk_layer_guatemala = "tgf_wmo_plugins.ibf:RiskLayerGuatemala"
