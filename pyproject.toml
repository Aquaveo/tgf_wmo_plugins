[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "tgf-wmo-plugins"
version = "0.2.1"
description = "TethysDash visualizations for the WMO impact-based flood forecasting trainings"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "intake",
    "numpy",
    "pandas",
    "rasterio",
    "geopandas",
    "shapely",
    "fsspec",
    "aiohttp",
    "pyogrio",
    "zarr==3.1.6",
    "pyarrow==22.0.0"
]

[project.entry-points."intake.drivers"]
# One block per country: a family is listed only where the country's data
# supports it, which tests/test_countries.py checks against countries.py.
# guatemala
uffis_hazard_layer_guatemala = "tgf_wmo_plugins.hazard_layer:HazardLayerGuatemala"
uffis_impact_summary_guatemala = "tgf_wmo_plugins.impact_summary:ImpactSummaryGuatemala"
uffis_impact_layer_guatemala = "tgf_wmo_plugins.impact_layer:ImpactLayerGuatemala"
uffis_storm_card_guatemala = "tgf_wmo_plugins.storm_card:StormCardGuatemala"
uffis_storm_impact_layer_guatemala = "tgf_wmo_plugins.storm_impact_layer:StormImpactLayerGuatemala"
uffis_storm_impact_summary_guatemala = "tgf_wmo_plugins.storm_impact_summary:StormImpactSummaryGuatemala"
# haiti
uffis_hazard_layer_haiti = "tgf_wmo_plugins.hazard_layer:HazardLayerHaiti"
uffis_impact_summary_haiti = "tgf_wmo_plugins.impact_summary:ImpactSummaryHaiti"
uffis_impact_layer_haiti = "tgf_wmo_plugins.impact_layer:ImpactLayerHaiti"
uffis_storm_card_haiti = "tgf_wmo_plugins.storm_card:StormCardHaiti"
uffis_storm_impact_layer_haiti = "tgf_wmo_plugins.storm_impact_layer:StormImpactLayerHaiti"
uffis_storm_impact_summary_haiti = "tgf_wmo_plugins.storm_impact_summary:StormImpactSummaryHaiti"
# antigua_barbuda
uffis_hazard_layer_antigua_barbuda = "tgf_wmo_plugins.hazard_layer:HazardLayerAntiguaBarbuda"
uffis_impact_summary_antigua_barbuda = "tgf_wmo_plugins.impact_summary:ImpactSummaryAntiguaBarbuda"
uffis_impact_layer_antigua_barbuda = "tgf_wmo_plugins.impact_layer:ImpactLayerAntiguaBarbuda"
uffis_storm_card_antigua_barbuda = "tgf_wmo_plugins.storm_card:StormCardAntiguaBarbuda"
uffis_storm_impact_layer_antigua_barbuda = "tgf_wmo_plugins.storm_impact_layer:StormImpactLayerAntiguaBarbuda"
uffis_storm_impact_summary_antigua_barbuda = "tgf_wmo_plugins.storm_impact_summary:StormImpactSummaryAntiguaBarbuda"
# barbados
uffis_hazard_layer_barbados = "tgf_wmo_plugins.hazard_layer:HazardLayerBarbados"
uffis_impact_summary_barbados = "tgf_wmo_plugins.impact_summary:ImpactSummaryBarbados"
uffis_impact_layer_barbados = "tgf_wmo_plugins.impact_layer:ImpactLayerBarbados"
uffis_storm_card_barbados = "tgf_wmo_plugins.storm_card:StormCardBarbados"
uffis_storm_impact_layer_barbados = "tgf_wmo_plugins.storm_impact_layer:StormImpactLayerBarbados"
uffis_storm_impact_summary_barbados = "tgf_wmo_plugins.storm_impact_summary:StormImpactSummaryBarbados"
# comoros
uffis_hazard_layer_comoros = "tgf_wmo_plugins.hazard_layer:HazardLayerComoros"
